# This workflow runs checks on pull requests to ensure code quality and prevent regressions.
#
# Adapted from recursica-adapter-mantine-v8's pull-request.yml: dropped the
# ADAPTER_STATUS.md validation and test steps, neither of which apply to this
# prototype template.

name: Pull Request Check

on:
  pull_request:
    branches: [main]

jobs:
  check-pull-request:
    # Don't run on changeset-release branches
    if: ${{ !startsWith(github.head_ref, 'changeset-release') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          # This prevents husky from installing git hooks during the CI process
          HUSKY: 0

      - name: Check types
        run: npm run check-types

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
