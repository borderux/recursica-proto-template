# Release Workflow
#
# Adapted from recursica-adapter-mantine-v8's release.yml. That version
# publishes to npm on merge (`changeset publish`, via a `release` script and
# an NPM_TOKEN/RELEASE_PAT). This repo is a private prototype template with
# no npm package to publish, so this workflow only opens/updates the
# Changesets "Version Packages" PR — there's no publish step, so the default
# GITHUB_TOKEN is enough and no npm auth is needed.
#
# How it works:
# 1. Triggers on changes to .changeset/, src/, or package files on main
# 2. Uses Changesets to detect whether there's a version bump pending
# 3. If changesets are present, opens/updates a "Version Packages" PR that
#    bumps package.json and rewrites CHANGELOG.md

name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".changeset/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write # To create releases and tags
      pull-requests: write # To create pull requests
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      # Build before opening the version PR so it fails fast if the build is broken.
      - name: Build
        run: npm run build

      - name: Create Release Pull Request
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
